# Form 34A, 2022 General Election (presidential result at the polling station),
# as photographed and transmitted by KIEMS kits. Reference is 1654x2340, the
# native size of the KIEMS image; handwriting has been erased from it (printed
# rules kept).
name: form34a_2022
form: 34A
reference: reference.png
padding: 8
# Results regions: no mask block may touch these (checked on every page, and
# by `rfpii verify`). Header with form serial + QR, station names and codes,
# the votes table, polling-station counts and disputed votes.
protect:
  - name: header_and_qr
    rect: [40, 20, 1610, 145]
  - name: station_and_codes
    rect: [60, 290, 1540, 175]
  - name: votes
    rect: [50, 480, 1560, 540]
  - name: counts_and_disputed
    rect: [50, 1020, 1560, 228]
# What a vision review of the redacted page reads (--vlm-audit): from the
# declaration down, where officers and agents sign and write. The results
# above are protected and hold no one's details.
review_area: [0, 1250, 1654, 1090]
# Reasons for refusal and the Presiding Officer's comments, where officers
# also sign (and may write an ID or phone number). Read with OCR, as forms
# without a template are: numbers are partially masked, signatures hidden,
# the comments themselves stay readable. `text_h`: printed text height in the
# reference (OCR box, px), the scale they are read at.
text_h: 34.6
free_text:
  - name: comments
    rect: [30, 1980, 1600, 360]
structure:
  # Agents table incl. its top border; its printed rules position every zone
  # below (photos of curled pages put the global fit rows off down here).
  # When they can't be matched, the zones' search is widened, up to the
  # `fence` labels: the table's title and headers and the "Reasons for
  # Refusal to Sign" label below it, found on the page.
  - name: agents
    rect: [60, 1500, 1530, 480]
zones:
  # Presiding officer and deputy: each signature masked by a band through its middle.
  # Two cells, one per signature line; strokes found a little above/below
  # (signatures stray off the line) are included.
  - name: officer_signatures
    action: signature
    rect: [1008, 1350, 330, 56]
    rows: 2
    row_step: 56
    search: [12, 24]
    region: agents
    fence:
      below: [82, 1474, 378, 36]      # "Agents or Candidates (if present)"
  # Agents table, 11 rows. Names stay visible.
  - name: agent_id
    action: partial
    rule: id           # hide 3 random characters
    digits: 8
    rect: [500, 1562, 178, 36.4]
    rows: 11
    row_step: 36.4
    region: agents
    fence:
      above: [524, 1529, 146, 28]     # "ID/Passport No."
      below: [62, 1984, 236, 34]      # "Reasons for Refusal"
  - name: agent_phone
    action: partial
    rule: phone        # keep the prefix (0734...), hide 3 of the last 6 digits
    digits: 10
    rect: [1050, 1566, 171, 36.4]
    rows: 11
    row_step: 36.4
    region: agents
    fence:
      above: [1078, 1537, 118, 26]    # "Tel. Contact"
      below: [62, 1984, 236, 34]
  # Agents' signatures: each masked by a band through its middle; empty rows untouched.
  - name: agent_signatures
    action: signature
    rect: [1221, 1562, 225, 36.4]
    rows: 11
    row_step: 36.4
    region: agents
    fence:
      above: [1290, 1543, 104, 25]    # "Signature"
      below: [62, 1984, 236, 34]
